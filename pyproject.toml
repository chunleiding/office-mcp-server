[project]
name = "office-mcp-server"
version = "0.1.0"
description = "MCP Server for Office documents (Word/Excel/PPT) with template cloning support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "lxml>=5.0.0",
]

[project.scripts]
office-mcp-server = "office_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/office_mcp"]
